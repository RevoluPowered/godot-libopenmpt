name: Build libopenmpt-godot

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SConstruct'
      - 'godot-cpp/**'
      - 'libopenmpt/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SConstruct'
      - 'godot-cpp/**'
      - 'libopenmpt/**'
      - '.github/workflows/build.yml'
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons wget unzip

      - name: Install Godot 4.6
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip Godot_v4.6-stable_linux.x86_64.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          sudo mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot

      - name: Build with tests enabled
        run: scons target=template_debug arch=x86_64 tests=yes -j$(nproc)

      - name: Setup test environment
        run: |
          mkdir -p tests/bin
          cp demo/bin/libopenmpt.gdextension tests/bin/
          cp demo/bin/*.so tests/bin/

      - name: Run tests
        timeout-minutes: 2
        run: godot --headless --path tests --script test_runner.gd --verbose

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]
        target: [template_debug, template_release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libflac-dev

      - name: Build libopenmpt-godot
        run: |
          scons target=${{ matrix.target }} arch=${{ matrix.arch }} -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libopenmpt-godot-linux-${{ matrix.arch }}-${{ matrix.target }}
          path: demo/bin/*.so

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64]
        target: [template_debug, template_release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            make

      - name: Install SCons in MSYS2
        shell: msys2 {0}
        run: pip install scons

      - name: Build libopenmpt-godot
        shell: msys2 {0}
        run: scons target=${{ matrix.target }} arch=${{ matrix.arch }} use_mingw=yes -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libopenmpt-godot-windows-${{ matrix.arch }}-${{ matrix.target }}
          path: demo/bin/*.dll

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [universal]
        target: [template_debug, template_release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install scons pkg-config flac

      - name: Build libopenmpt-godot
        run: |
          scons target=${{ matrix.target }} arch=${{ matrix.arch }} -j$(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libopenmpt-godot-macos-${{ matrix.arch }}-${{ matrix.target }}
          path: demo/bin/*.framework

  package-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release
        run: |
          mkdir -p release/addons/libopenmpt/bin

          # Copy gdextension file
          cp demo/bin/libopenmpt.gdextension release/addons/libopenmpt/bin/

          # Copy all built libraries
          find artifacts -type f \( -name "*.so" -o -name "*.dll" \) -exec cp {} release/addons/libopenmpt/bin/ \;
          find artifacts -type d -name "*.framework" -exec cp -r {} release/addons/libopenmpt/bin/ \;

          # Copy README and LICENSE
          cp README.md release/addons/libopenmpt/
          if [ -f LICENSE ]; then cp LICENSE release/addons/libopenmpt/; fi

          # Create archive
          cd release
          zip -r ../libopenmpt-godot-${{ github.event.release.tag_name }}.zip addons/

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./libopenmpt-godot-${{ github.event.release.tag_name }}.zip
          asset_name: libopenmpt-godot-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip
